name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # CI runs without downloading the graphics stored in Git LFS.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Block files > 50 MB that are not in Git LFS
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          if [ -n "$big" ]; then
            echo "::error::Files over 50 MB committed without Git LFS:"
            echo "$big"
            exit 1
          fi
          echo "no large non-LFS files"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run build
      - run: npm run test:visual -- --update-snapshots=missing
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-screenshots
          path: |
            tests/visual/__screenshots__/linux/
            out/visual/
          retention-days: 7
